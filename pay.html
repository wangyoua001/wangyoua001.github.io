<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码支付</title>
    <style>
        :root { --bg: #ffffff; --text: #333333; --tab-border: #eeeeee; --text-light: #666666; }
        [data-theme="dark"] { --bg: #0f172a; --text: #e2e8f0; --tab-border: #334155; --text-light: #94a3b8; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; transition: background-color 0.3s; }
        .pay-container { width: 100%; max-width: 400px; text-align: center; }
        .title { font-size: 1.2rem; margin: 20px 0; font-weight: bold; }
        .title span { color: #e11d48; font-size: 1.5rem; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--tab-border); }
        .tab { flex: 1; padding: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: var(--text-light); }
        .tab.active-alipay { color: #1677ff; border-bottom: 3px solid #1677ff; }
        .tab.active-wechat { color: #07c160; border-bottom: 3px solid #07c160; }

        .pay-content { display: none; border-radius: 16px; padding: 30px 20px; color: white; }
        .pay-content.active { display: block; }
        
        .alipay-bg { background-color: #1677ff; }
        .wechat-bg { background-color: #07c160; }
        .pay-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 20px; }
        
        .qr-box { background: white; padding: 15px; border-radius: 12px; margin: 0 auto 15px; width: 220px; height: 220px; }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .success-message {
            display: none; margin-top: 20px; padding: 15px;
            background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981;
            border-radius: 8px; color: #10b981; font-weight: bold; font-size: 1.05rem;
        }

        .get-btn {
            background: #10b981; color: white; border: none; padding: 15px;
            font-size: 1.1rem; border-radius: 8px; width: 100%; margin-top: 20px; cursor: pointer;
            display: none;
        }

        .back-btn { display:block; margin-top:20px; color:var(--text-light); text-decoration:none; }
    </style>
</head>
<body>

<div class="pay-container">
    <div class="title">请支付 <span id="payAmount">5</span> 元</div>

    <div class="tabs">
        <div class="tab active-alipay" onclick="switchTab('alipay')">支付宝支付</div>
        <div class="tab" onclick="switchTab('wechat')">微信支付</div>
    </div>

    <div id="alipay" class="pay-content alipay-bg active">
        <div class="pay-title">推荐使用支付宝</div>
        <div class="qr-box">
            <img src="zfb.jpg" alt="支付宝收款码">
        </div>
    </div>

    <div id="wechat" class="pay-content wechat-bg">
        <div class="pay-title">推荐使用微信支付</div>
        <div class="qr-box">
            <img src="wx.jpg" alt="微信收款码">
        </div>
    </div>

    <div id="productSuccessMsg" class="success-message">
        🎉 付款成功后，祝您天天开心，万事顺意！
    </div>

    <button class="get-btn" id="donateBtn" onclick="finishDonate()">我已完成捐赠</button>

    <a href="index.html" class="back-btn">← 返回首页</a>
</div>

<script>
    // 主题初始化
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const productType = urlParams.get('type') || 'google';
    let currentPrice = 5;
    
    if (productType === 'donate') {
        currentPrice = urlParams.get('amount');
        document.getElementById('donateBtn').style.display = 'block';
    } else {
        document.getElementById('productSuccessMsg').style.display = 'block';
    }
    
    document.getElementById('payAmount').innerText = currentPrice;

    function finishDonate() {
        alert("感谢您的慷慨捐赠！愿好运常伴您左右！");
        window.location.href = "index.html";
    }

    function switchTab(type) {
        document.querySelectorAll('.pay-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => {
            el.classList.remove('active-alipay', 'active-wechat');
        });
        if (type === 'alipay') {
            document.getElementById('alipay').classList.add('active');
            document.querySelector('.tabs .tab:nth-child(1)').classList.add('active-alipay');
        } else {
            document.getElementById('wechat').classList.add('active');
            document.querySelector('.tabs .tab:nth-child(2)').classList.add('active-wechat');
        }
    }
</script>

</body>
</html>
