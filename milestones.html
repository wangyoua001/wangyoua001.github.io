<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>wangyouA 的里程碑</title>
    <style>
        :root {
            --bg-color: #f8fafc; --dot-color: #e2e8f0;
            --text-main: #333333; --text-sub: #64748b;
            --card-bg: #ffffff; --card-border: #f1f5f9;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --dot-color: #1e293b;
            --text-main: #e2e8f0; --text-sub: #94a3b8;
            --card-bg: #1e293b; --card-border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main); padding: 20px;
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px; display: flex; justify-content: center; min-height: 100vh;
            transition: background-color 0.3s;
        }
        .container { max-width: 600px; width: 100%; margin-top: 20px;}
        
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-header h1 { font-size: 2rem; font-weight: 900; margin-bottom: 10px; letter-spacing: 1px; }
        .page-header p { color: var(--text-sub); font-size: 0.95rem; }

        .milestone-card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--card-border);
            transition: transform 0.2s, background-color 0.3s;
        }
        .milestone-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        
        .milestone-left { display: flex; align-items: center; gap: 15px; }
        .m-icon { font-size: 2.2rem; width: 50px; text-align: center; }
        .m-info { display: flex; flex-direction: column; }
        .m-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
        .m-desc { font-size: 0.8rem; color: var(--text-sub); }
        .m-date { font-size: 0.85rem; font-weight: bold; padding: 6px 12px; border-radius: 8px; font-family: monospace; }

        .xhs-card { border-left: 5px solid #ff2442; }
        .xhs-card .m-title { color: #ff2442; }
        .xhs-card .m-date { background: rgba(255, 36, 66, 0.1); color: #be123c; }
        [data-theme="dark"] .xhs-card .m-date { color: #fda4af; }

        .bili-card { border-left: 5px solid #00a1d6; }
        .bili-card .m-title { color: #00a1d6; }
        .bili-card .m-date { background: rgba(0, 161, 214, 0.1); color: #0369a1; }
        [data-theme="dark"] .bili-card .m-date { color: #7dd3fc; }

        .back-btn {
            display: block; text-align: center; margin-top: 40px; padding: 15px;
            background: var(--card-bg); color: var(--text-main); text-decoration: none;
            border-radius: 12px; font-weight: bold; border: 1px solid var(--card-border); transition: 0.2s;
        }
        .back-btn:hover { background: var(--dot-color); }

        .footer-sig { text-align: center; margin-top: 40px; font-size: 0.75rem; color: var(--text-sub); padding-bottom: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>🏆 里程碑数据</h1>
        <p>感谢大家一路以来的支持与陪伴</p>
    </div>

    <div class="milestone-card xhs-card">
        <div class="milestone-left">
            <div class="m-icon">🎉</div>
            <div class="m-info">
                <div class="m-title">小红书粉丝破 1000</div>
                <div class="m-desc">达成小目标，感谢关注！</div>
            </div>
        </div>
        <div class="m-date">2026.11.09</div>
    </div>

    <div class="milestone-card bili-card">
        <div class="milestone-left">
            <div class="m-icon">⭐</div>
            <div class="m-info">
                <div class="m-title">Bilibili 总播放 10W+</div>
                <div class="m-desc">感谢B站小伙伴们的支持</div>
            </div>
        </div>
        <div class="m-date">2026.10.13</div>
    </div>

    <a href="index.html" class="back-btn">← 返回首页</a>

    <div class="footer-sig">
        本网站由 DeepSeek AI 进行主要制作<br>
        本站由 wangyouA 所有
    </div>
</div>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
</script>
</body>
</html>
